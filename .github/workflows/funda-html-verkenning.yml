name: Funda HTML verkenning

# Eenmalige verkenning van funda.nl's zoekpagina, als voorbereiding op de
# HTML-fallback. Gebruikt geen secrets en publiceert niets naar de repo;
# de opgehaalde HTML komt als artifact beschikbaar.

on:
  workflow_dispatch: {}

jobs:
  verkennen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi

      - name: Verkenning draaien
        run: python scripts/funda_html_verkenning.py

      - name: HTML als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: funda-html-dump
          path: html_dump/
          retention-days: 3

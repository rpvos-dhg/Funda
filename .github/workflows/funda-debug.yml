name: Funda API debug

# Handmatige probe om te zien wat de Funda-API precies terugstuurt.
# Gebruikt geen secrets en publiceert niets; alleen logging in de Actions-output.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/0xMH/pyfunda.git@v2.9.0"

      # TIJDELIJK (wordt voor de merge teruggedraaid): structuuranalyse van de
      # HTML-zoekpagina als laatste stap, zodat de output in de log-staart past.
      - name: HTML-structuur analyseren
        run: python scripts/funda_html_analyse.py

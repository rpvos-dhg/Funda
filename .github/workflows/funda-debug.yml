name: Funda API debug

# Handmatige diagnose: wat doen de Funda-endpoints, en werkt de HTML-fallback
# nog op de echte site? Gebruikt geen secrets en publiceert niets.
#
# Draai dit als het rapport leeg blijft of als een run faalt.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline tests
        run: |
          python test_funda_html.py
          python test_funda_zoek.py

      - name: API-probe draaien
        run: python scripts/funda_api_debug.py

      # Als laatste, zodat de uitkomst in de log-staart staat: werkt de
      # HTML-zoekpagina nog zoals de parser verwacht?
      - name: HTML-fallback valideren tegen funda.nl
        run: python scripts/funda_html_validatie.py

      # TIJDELIJK: welke gebied-/straalnotaties accepteert funda.nl?
      - name: Gebied-notaties meten
        run: python scripts/funda_gebied_probe.py

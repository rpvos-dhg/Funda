name: Funda API debug

# Handmatige probe om te zien wat de Funda-API precies terugstuurt.
# Gebruikt geen secrets en publiceert niets; alleen logging in de Actions-output.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/0xMH/pyfunda.git@v2.9.0"

      - name: Offline tests
        run: python test_funda_html.py

      # TIJDELIJK (gaat er voor de merge weer uit): validatie van de
      # HTML-fallback tegen de echte funda.nl, als laatste stap zodat de
      # uitkomst in de log-staart past.
      - name: HTML-fallback valideren
        run: python scripts/funda_html_validatie.py

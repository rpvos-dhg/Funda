name: Funda API debug

# Handmatige diagnose: wat doen de Funda-endpoints, en werkt de HTML-fallback
# nog op de echte site? Gebruikt geen secrets en publiceert niets.
#
# Draai dit als het rapport leeg blijft of als een run faalt.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline tests
        run: |
          python test_funda_html.py
          python test_funda_zoek.py
          python test_funda_mail.py

      # De twee stappen hieronder hebben funda.nl nodig en falen daarom zolang
      # de runner geblokkeerd is (zie CLAUDE.md). Dat is een eigenschap van het
      # netwerk, niet van de code, dus ze mogen deze workflow niet rood maken -
      # anders verdwijnt het signaal van de offline tests hierboven. De logs
      # laten nog steeds precies zien wat funda teruggeeft.
      # Zodra de blokkade weg is: continue-on-error eraf, dan geven ze weer
      # signaal over de parser.
      - name: API-probe draaien
        continue-on-error: true
        run: python scripts/funda_api_debug.py

      - name: HTML-fallback valideren tegen funda.nl
        continue-on-error: true
        run: python scripts/funda_html_validatie.py

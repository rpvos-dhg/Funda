name: Funda API debug

# Handmatige probe om te zien wat de Funda-API precies terugstuurt.
# Gebruikt geen secrets en publiceert niets; alleen logging in de Actions-output.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/0xMH/pyfunda.git@v2.9.0"

      - name: API-probe draaien
        run: python scripts/funda_api_debug.py

      # TIJDELIJK (wordt voor de merge teruggedraaid): verkenning van de
      # HTML-zoekpagina, zodat de fallback op echte structuur gebouwd wordt.
      - name: HTML-verkenning draaien
        run: python scripts/funda_html_verkenning.py

      - name: HTML-structuur analyseren
        run: python scripts/funda_html_analyse.py

      - name: HTML als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: funda-html-dump
          path: html_dump/
          retention-days: 3

name: Funda API debug

# PROBE-BRANCH (claude/probe-andere-woningsites): draait alleen de meting van
# derde-partij woningsites. Publiceert niets en gebruikt geen secrets.
#
# De log van een publieke repo is leesbaar voor iedereen: de probe print alleen
# publieke advertentie-informatie (adres, prijs, m2), niets privé.

on:
  workflow_dispatch: {}

jobs:
  derden-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline tests huispedia-bron
        run: python test_bron_huispedia.py

      # Max 60 verzoeken, >= 0,8 s pauze, robots.txt per URL gecontroleerd,
      # stopt per site bij 401/403/429 of een bot-controle.
      - name: Derde-partij woningsites meten
        run: python scripts/bronnen_derden_probe.py

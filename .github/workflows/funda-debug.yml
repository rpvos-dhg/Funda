name: Funda API debug

# PROBE-BRANCH (claude/probe-andere-woningsites): draait alleen de meting van
# derde-partij woningsites. Publiceert niets en gebruikt geen secrets.
#
# De log van een publieke repo is leesbaar voor iedereen: de probe print alleen
# publieke advertentie-informatie (adres, prijs, m2), niets privé.

on:
  workflow_dispatch: {}

jobs:
  derden-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Python opzetten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline tests
        run: |
          python test_bron_huispedia.py
          python test_funda_zoek.py

      # De meting zelf (scripts/bronnen_derden_probe.py) draaide in run
      # 42265393898 en staat hier bewust NIET meer: pararius gaf daar een 403,
      # en een blokkade proberen we niet nog eens.
      #
      # End-to-end: funda_zoek.py met huispedia als bron, met een generieke,
      # niet-persoonlijke config (geen secrets). Max 25 detailpagina's, plus
      # 2 zoekverzoeken en 2 PDOK-verzoeken. Publiceert niets (--no-push, en
      # deze workflow commit niets).
      - name: End-to-end funda_zoek.py via huispedia
        env:
          FUNDA_ZOEK_METHODE: huispedia
          HUISPEDIA_MAX_DETAILS: "25"
        run: |
          cat > funda_personal.json <<'EOF'
          {"bruto_jaar": 50000, "eigen_inleg": 0, "duo_maandlast": 0, "leeftijd": 30,
           "postcode_huidig": "2511BT", "werk_postcodes": [],
           "prijs_min": 230000, "prijs_max": 310000, "m2_min": 55, "radius_km": 6}
          EOF
          python funda_zoek.py --no-push --no-open
          echo "--- run-summary (aantallen) ---"
          python -c "import json; d=json.load(open('funda_run_summary.json')); print({k: (len(v) if isinstance(v, list) else v) for k, v in d.items()})"

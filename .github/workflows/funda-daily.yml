name: Funda dagelijks rapport

# Draait twee keer per dag op GitHub (rooster hieronder; niet afhankelijk van de laptop).
# Gevoelige gegevens komen uit GitHub Secrets en worden NOOIT gecommit.
# State (seen-ids, prijs-tracking, coordinaten, caches) staat in de Actions-cache,
# dus blijft bewaard maar staat niet publiek in de repo.

on:
  schedule:
    # GitHub-cron is UTC en kan een paar minuten later starten.
    # Twee keer per dag. Funda: aanbod staat ~4u na aanmelden online en makelaars
    # publiceren overdag, met een kijkpiek rond 19:00. Daarom laat-ochtend
    # (vroege aanmeldingen net verwerkt) en eind van de middag (net voor de piek).
    - cron: "30 8 * * *"    # 10:30 NL (zomertijd) / 09:30 (wintertijd)
    - cron: "30 16 * * *"   # 18:30 NL (zomertijd) / 17:30 (wintertijd)
  workflow_dispatch:      # knop om handmatig te draaien
    inputs:
      sitemap_max_verkennen:
        description: >-
          Sitemaproute: verkennende detail-calls deze run (leeg = standaard 200).
          Eenmalig hooguit 600 (plafond in de code) om de opstartachterstand
          sneller weg te werken.
        required: false
        default: ""

# Voorkom dat twee runs tegelijk de repo pushen.
concurrency:
  group: funda-daily
  cancel-in-progress: false

# Standaard niets; de job hieronder krijgt alleen wat hij nodig heeft.
permissions: {}

# Acties staan vast op een commit-SHA (de tag erachter is alleen voor de lezer):
# een tag kan verzet worden, een commit niet. Bijwerken: de SHA opzoeken met
# `git ls-remote https://github.com/actions/<naam> refs/tags/<tag>`.

jobs:
  rapport:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nodig om het versleutelde docs/ rapport terug te pushen
    # Normaal ~5 minuten (inclusief 90 s wachten op Pages). Een hangend
    # detail-endpoint stopt de run zelf al (time-outs tellen als storing, en het
    # verkennen heeft een tijdsbudget); dit is het vangnet daarachter.
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # Het token blijft niet in .git/config staan: alleen de stap die docs/
          # publiceert krijgt het (zie daar).
          persist-credentials: false

      - name: Python opzetten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Dependencies installeren
        run: |
          # requirements.txt is de enige plek waar versies staan (pyfunda-pin!):
          # exacte versies met hashes, gegenereerd uit requirements.in. pip
          # weigert alles wat niet in de lijst staat of een andere hash heeft.
          pip install --require-hashes -r requirements.txt

      # State terughalen uit vorige run. Bevat geen persoonlijke gegevens van jou,
      # wel je werk-coordinaten, daarom in de cache en niet in de publieke repo.
      - name: State terughalen (cache)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            funda_seen_ids.json
            funda_tracking.json
            funda_werk_coords.json
            funda_thuis_coords.json
            funda_enrichment_cache.json
            funda_sitemap_cache.json
            funda_blacklist.json
          key: funda-state-${{ github.run_id }}
          restore-keys: |
            funda-state-

      # Secrets naar bestanden schrijven. Stopt hard als het wachtwoord ontbreekt,
      # zodat er nooit per ongeluk een ONVERSLEUTELD rapport publiek wordt gezet.
      - name: Geheime config klaarzetten
        env:
          FUNDA_PERSONAL_JSON: ${{ secrets.FUNDA_PERSONAL_JSON }}
          FUNDA_PWA_PASSWORD: ${{ secrets.FUNDA_PWA_PASSWORD }}
          FUNDA_BLACKLIST_JSON: ${{ secrets.FUNDA_BLACKLIST_JSON }}
        run: |
          if [ -z "$FUNDA_PWA_PASSWORD" ]; then
            echo "::error::Secret FUNDA_PWA_PASSWORD ontbreekt. Gestopt om te voorkomen dat het rapport onversleuteld publiek wordt."
            exit 1
          fi
          if [ -z "$FUNDA_PERSONAL_JSON" ]; then
            echo "::error::Secret FUNDA_PERSONAL_JSON ontbreekt."
            exit 1
          fi
          printf '%s' "$FUNDA_PERSONAL_JSON" > funda_personal.json
          printf '%s' "$FUNDA_PWA_PASSWORD" > funda_pwa_password.txt
          # Blacklist optioneel: alleen als secret bestaat en cache hem niet al gaf.
          if [ -n "$FUNDA_BLACKLIST_JSON" ] && [ ! -f funda_blacklist.json ]; then
            printf '%s' "$FUNDA_BLACKLIST_JSON" > funda_blacklist.json
          fi
          # Snelle sanity-check dat de JSON geldig is.
          python -c "import json; json.load(open('funda_personal.json'))"

      - name: Rapport genereren
        env:
          FUNDA_REQUIRE_ENCRYPTION: "1"   # weiger onversleuteld te publiceren
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          # Zoekbron: 'auto' (api -> html -> sitemap); op Actions werkt de
          # sitemaproute. Geen mail-secrets meer: de mailroute zit niet in 'auto'
          # en draait alleen bij een expliciete zoek_methode 'mail' (zie CLAUDE.md).
          # Leeg bij geplande runs; dan geldt de standaard (200 of de config).
          FUNDA_SITEMAP_MAX_VERKENNEN: ${{ inputs.sitemap_max_verkennen }}
        run: python funda_zoek.py --no-push --no-open

      # Geheimen meteen wissen na generatie, voordat we iets committen of cachen.
      - name: Geheimen wissen
        if: always()
        run: rm -f funda_personal.json funda_pwa_password.txt

      # Geen automatische probe meer bij een mislukte run. Die deed extra
      # verzoeken met andere profielen tegen een endpoint dat net weigerde, twee
      # keer per dag zolang het stuk was; dat is "nog eens proberen" en hoort
      # niet bij een lage belasting. De ::error van de run zelf noemt de oorzaak;
      # verder diagnosticeren gaat met de handmatige workflow "Funda API debug".

      # De enige stap met het schrijf-token. Het gaat als header mee met de pull
      # en de push van deze stap en komt niet in .git/config, dus de stappen
      # hiervoor (pip, de run zelf) en hierna (npm, de push-notificatie) kunnen
      # er niet bij.
      - name: Versleuteld rapport publiceren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          met_token() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"
          }
          git config user.name "funda-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in het rapport."
          else
            git commit -m "auto: rapport $(date -u +%Y-%m-%dT%H:%MZ)"
            # main kan tijdens de run veranderd zijn (een gemergde PR); dan werd
            # de push geweigerd en ging het rapport verloren (run 42290940091).
            # docs/ wijzigt alleen deze bot, dus rebasen is veilig.
            met_token pull --rebase origin main
            met_token push
          fi

      # GitHub Pages heeft typisch 30-90s nodig om docs/ te deployen na de push.
      # Wacht zodat het rapport online staat voordat de iOS-notificatie aankomt.
      - name: Wachten op Pages-deploy
        run: sleep 90

      # web-push en alles eronder staan vast in package-lock.json (versie en
      # hash); --ignore-scripts draait geen installatiescripts van pakketten.
      # Een eigen stap zonder secrets in de omgeving.
      - name: Push-pakket installeren
        run: npm ci --ignore-scripts

      - name: Push-notificatie bij nieuwe woningen
        env:
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
        run: |
          if [ -z "$WEB_PUSH_PUBLIC_KEY" ] || [ -z "$WEB_PUSH_PRIVATE_KEY" ] || [ -z "$WEB_PUSH_SUBSCRIPTION" ]; then
            echo "Web Push secrets ontbreken; notificatie overgeslagen."
            exit 0
          fi
          node scripts/send_web_push.cjs

      # State bewaren voor de run van morgen (rollende cache-sleutel).
      - name: State bewaren (cache)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            funda_seen_ids.json
            funda_tracking.json
            funda_werk_coords.json
            funda_thuis_coords.json
            funda_enrichment_cache.json
            funda_sitemap_cache.json
            funda_blacklist.json
          key: funda-state-${{ github.run_id }}

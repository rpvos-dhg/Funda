<style>
/* Woningrapport, palet "Inkt en blauw" (besluit van 7 nov 2026, .interface-design/system.md): inktblauw als merkvlak (topbalk,
   toast, slotsymbool), helder blauw voor knoppen, chips en score, donkerblauw voor links en koppen, koel
   leigrijs als vlak en wit voor kaarten. Feedbackkleuren (goed, let op, fout, info) alleen voor feedback.
   De poort is nooit alleen kleur: woord plus icoon, ook op de pins. Hex ALLEEN in de drie tokenblokken
   (licht, donker via media query en :root[data-theme="dark"], die twee gelijk). Uitzondering:
   dialog::backdrop (rgba; custom properties erven daar niet in Safari). Systeemletter, geen webfont.
   Waarden per token, licht en donker: .interface-design/system.md (tabel Kleur).
   Gemeten contrast (WCAG 2.x, test_funda_ui.py), licht|donker. Tekst minimaal 4,5:
     tekst/pagina 16,5|17,2, tekst/kaart 17,9|15,6, tekst/inzet 15,8|14,0, subtiel/pagina 6,9|8,9,
     subtiel/kaart 7,5|8,0, subtiel/inzet 6,6|7,2, kop/pagina 6,2|9,9, kop/kaart 6,7|9,0,
     score/pagina 4,8|9,0, score/kaart 5,2|8,2, link en knoptekst/pagina 6,2|10,8,
     link en knoptekst/kaart 6,7|9,7, knoptekst/hover 5,9|8,2, topbalk 17,9|14,6,
     topbalk subtiel 12,0|9,9, topbalk hover 14,6|11,4, knop aan 5,2|8,3, knop aan hover 6,7|10,7,
     status Past 16,0|14,2, status Krap 16,1|14,0, status Past niet 15,6|14,7,
     status onbekend 15,6|14,1, plus/kaart 5,0|9,0, min/kaart 5,7|8,1, plusteken 5,0|9,0,
     minteken 5,7|8,1, label daling 7,4|7,4, label lang 7,1|7,1, pin Past 5,0|5,0, pin Krap 6,6|6,6,
     pin Past niet 5,7|5,7, pin Prijs onbekend 5,8|5,8
   Niet-tekst (randen, iconen, focus, schakelaar, balk) minimaal 3,0:
     veldrand/kaart 4,8|5,9, veldrand/inzet 4,2|5,3, veldrand/pagina 4,4|6,5, knoprand/pagina 4,4|6,5,
     knoprand/kaart 4,8|5,9, schakelaar uit 6,1|6,1, focus/pagina 3,4|7,4, focus/kaart 3,7|6,7,
     keuze aan/kaart 5,2|8,3, chip aan/pagina 4,8|9,1, icoon Past 4,5|8,2, icoon Krap 3,5|8,6,
     icoon Past niet 5,0|7,7, icoon onbekend 5,0|7,5, rand Past 5,0|9,0, rand Krap 3,9|9,6,
     rand Past niet 5,7|8,1, rand onbekend 5,8|8,3, rand melding 3,6|10,6, balk plus 4,4|8,1,
     balk min 5,0|7,3
   Niet getest: border default en subtle (decoratief: kaartrand, scheidingslijn; een interactieve rand
   gebruikt interactive-neutral).
*/
:root{
  color-scheme:light dark;
  /* vlakken */
  --background-color-page:#f4f6f9;
  --background-color-default:#ffffff;
  --background-color-inset:#eef1f5;
  --background-color-subtle:#e2e8f0;
  --background-color-strong:#0f172a;
  --background-color-on-strong-hover:#1e293b;
  /* tekst */
  --foreground-color-strong:#1d4ed8;
  --foreground-color-neutral:#0f172a;
  --foreground-color-subtle:#4b5567;
  --foreground-color-on-strong:#ffffff;
  --foreground-color-on-strong-subtle:#cbd5e1;
  --foreground-color-highlight-strong:#2563eb;
  /* randen */
  --border-color-default:#d5dbe3;
  --border-color-subtle:#e4e8ee;
  --border-color-interactive-neutral:#64748b;
  --border-color-interactive-focus:#3b82f6;
  /* interactief */
  --background-color-interactive-strong:#2563eb;
  --background-color-interactive-strong-hover:#1d4ed8;
  --foreground-color-interactive-on-strong:#ffffff;
  --background-color-interactive-weak:#eaf0fe;
  --foreground-color-interactive-strong:#1d4ed8;
  /* feedback: tekst, icoon en rand; vlak */
  --foreground-color-feedback-positive:#16803c;
  --foreground-color-feedback-notice:#c46a00;
  --foreground-color-feedback-negative:#c4282b;
  --foreground-color-feedback-informative:#0b6aa8;
  --background-color-feedback-positive-weak:#e8f6ed;
  --background-color-feedback-notice-weak:#fdf2e1;
  --background-color-feedback-negative-weak:#fdeceb;
  --background-color-feedback-informative-weak:#e5f1fa;
  --status-tekst:#0f172a;            /* kleur zit in icoon en rand */
  /* labels (kansen, geen feedback): prijs gedaald, lang te koop */
  --label-daling:#a3195b; --label-lang:#485a6e; --label-tekst:#ffffff;
  /* kaartpins: ook in donker gelijk (ze staan op de tegels) */
  --pin-past:#16803c; --pin-krap:#e08a00; --pin-niet:#c4282b; --pin-onbekend:#0b6aa8;
  --pin-tekst:#ffffff; --pin-tekst-krap:#0f172a; --pin-rand:#ffffff; --pin-nieuw:#0f172a;
  /* ruimte, vorm, maat */
  --spacing-25:.125rem; --spacing-50:.25rem; --spacing-75:.375rem; --spacing-100:.5rem;
  --spacing-150:.75rem; --spacing-200:1rem; --spacing-300:1.5rem; --spacing-400:2rem;
  --radius-100:.25rem; --radius-200:.5rem; --radius-pill:6.25rem;
  --tap:2.75rem;                     /* 44 px minimum */
  --knop:3rem;                       /* 48 px */
  --top-h:3.5rem; --onder-h:4rem;
  /* typografie */
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --heading-medium:500 1.375rem/1.75rem var(--font-sans);
  --heading-small:600 1.0625rem/1.375rem var(--font-sans);
  --heading-app:600 1.125rem/1.5rem var(--font-sans);
  --paragraph-title-medium:600 1rem/1.5rem var(--font-sans);
  --paragraph-title-compact:600 .9375rem/1.375rem var(--font-sans);
  --paragraph-title-small:600 .875rem/1.25rem var(--font-sans);
  --paragraph-body-medium:400 1rem/1.5rem var(--font-sans);
  --paragraph-body-status:400 .9375rem/1.375rem var(--font-sans);
  --paragraph-body-small:400 .875rem/1.25rem var(--font-sans);
  --paragraph-body-xsmall:400 .8125rem/1.125rem var(--font-sans); /* 13 px minimum */
  --label-small:600 .8125rem/1.125rem var(--font-sans);
  --label-chip:600 .9375rem/1.25rem var(--font-sans);
  --teken:600 .8125rem/1 var(--font-sans);
  --cijfer-groot:600 1.25rem/1.5rem var(--font-sans);
  --icoon-sluit:400 1.5rem/2.75rem var(--font-sans);
}
/* Donker: vlakken bijna zwart met een blauwe zweem, de topbalk een tint lichter dan de pagina, licht
   blauw als accent (knop met donkere tekst), feedbackvlakken getint. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --background-color-page:#0b1120; --background-color-default:#141c2c; --background-color-inset:#1b2538;
  --background-color-subtle:#253148; --background-color-strong:#1e293b; --background-color-on-strong-hover:#2c3a52;
  --foreground-color-strong:#9dbcff; --foreground-color-neutral:#f1f5f9; --foreground-color-subtle:#a7b3c5;
  --foreground-color-on-strong:#ffffff; --foreground-color-on-strong-subtle:#cbd5e1;
  --foreground-color-highlight-strong:#8fb3ff; --border-color-default:#3a475e; --border-color-subtle:#263247;
  --border-color-interactive-neutral:#8a99b0; --border-color-interactive-focus:#6ea2ff;
  --background-color-interactive-strong:#93b4fd; --background-color-interactive-strong-hover:#b7cdfe;
  --foreground-color-interactive-on-strong:#0b1a3d; --background-color-interactive-weak:#1b2a48;
  --foreground-color-interactive-strong:#a8c4ff; --foreground-color-feedback-positive:#6fd08f;
  --foreground-color-feedback-notice:#f2b860; --foreground-color-feedback-negative:#f59a9a;
  --foreground-color-feedback-informative:#73bdf0; --background-color-feedback-positive-weak:#13281f;
  --background-color-feedback-notice-weak:#2b2416; --background-color-feedback-negative-weak:#2f1b22;
  --background-color-feedback-informative-weak:#11263b; --status-tekst:#f1f5f9;
  }
}
:root[data-theme="dark"]{
  --background-color-page:#0b1120; --background-color-default:#141c2c; --background-color-inset:#1b2538;
  --background-color-subtle:#253148; --background-color-strong:#1e293b; --background-color-on-strong-hover:#2c3a52;
  --foreground-color-strong:#9dbcff; --foreground-color-neutral:#f1f5f9; --foreground-color-subtle:#a7b3c5;
  --foreground-color-on-strong:#ffffff; --foreground-color-on-strong-subtle:#cbd5e1;
  --foreground-color-highlight-strong:#8fb3ff; --border-color-default:#3a475e; --border-color-subtle:#263247;
  --border-color-interactive-neutral:#8a99b0; --border-color-interactive-focus:#6ea2ff;
  --background-color-interactive-strong:#93b4fd; --background-color-interactive-strong-hover:#b7cdfe;
  --foreground-color-interactive-on-strong:#0b1a3d; --background-color-interactive-weak:#1b2a48;
  --foreground-color-interactive-strong:#a8c4ff; --foreground-color-feedback-positive:#6fd08f;
  --foreground-color-feedback-notice:#f2b860; --foreground-color-feedback-negative:#f59a9a;
  --foreground-color-feedback-informative:#73bdf0; --background-color-feedback-positive-weak:#13281f;
  --background-color-feedback-notice-weak:#2b2416; --background-color-feedback-negative-weak:#2f1b22;
  --background-color-feedback-informative-weak:#11263b; --status-tekst:#f1f5f9;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background-color-page);color:var(--foreground-color-neutral);font:var(--paragraph-body-medium);
  font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--foreground-color-interactive-strong)}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:1.25rem;height:1.25rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-s{width:1rem;height:1rem}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:where(a,button,summary,input,select,[tabindex]):focus-visible{outline:2px solid var(--border-color-interactive-focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.h-erf{font:inherit;color:inherit}
.mt-100{margin-top:var(--spacing-100)}

/* Skip-link */
.skip{position:absolute;left:var(--spacing-200);top:var(--spacing-100);z-index:400;transform:translateY(-200%);
  padding:var(--spacing-100) var(--spacing-200);border-radius:var(--radius-100);background:var(--background-color-default);
  color:var(--foreground-color-interactive-strong);font:var(--paragraph-title-compact);min-height:var(--tap);display:inline-flex;align-items:center}
.skip:focus{transform:none}

/* Topbalk (merkvlak) */
.context-strong{background:var(--background-color-strong);color:var(--foreground-color-on-strong)}
.app-top{position:sticky;top:0;z-index:100;
  padding:env(safe-area-inset-top) max(var(--spacing-200),env(safe-area-inset-right)) 0 max(var(--spacing-200),env(safe-area-inset-left))}
.app-top-in{display:flex;align-items:center;gap:var(--spacing-150);min-height:var(--top-h);max-width:80rem;margin:0 auto}
.app-top h1{font:var(--heading-app)}
.app-top p{font:var(--paragraph-body-small);color:var(--foreground-color-on-strong-subtle);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* één regel: de balk blijft 56 px, de plakkende koppen kloppen */
.app-top-tekst{flex:1;min-width:0}
.icoonknop{display:inline-grid;place-items:center;min-width:var(--tap);min-height:var(--tap);border-radius:var(--radius-100);
  border:0;background:transparent;color:inherit;cursor:pointer;text-decoration:none}
/* Focusring op het merkvlak: wit */
.context-strong :focus-visible{outline-color:var(--foreground-color-on-strong)}

/* Opbouw van de pagina */
.app{max-width:80rem;margin:0 auto;padding:0 var(--spacing-150) calc(var(--onder-h) + env(safe-area-inset-bottom) + var(--spacing-300))}
.app-main{min-width:0}
.app-zij{display:contents}
.zij-kop{display:none}

/* Snelfilters; de tellers zijn de samenvatting van de dag */
.snel{display:flex;gap:var(--spacing-100);overflow-x:auto;scrollbar-width:none;
  margin:0 calc(var(--spacing-150) * -1);padding:var(--spacing-150) var(--spacing-150) var(--spacing-100)}
.snel::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:var(--spacing-75);min-height:var(--tap);padding:0 var(--spacing-200);
  border-radius:var(--radius-pill);border:1px solid var(--border-color-interactive-neutral);background:var(--background-color-default);
  color:var(--foreground-color-neutral);font:var(--label-chip);cursor:pointer;white-space:nowrap}
.chip b{font-weight:400;color:var(--foreground-color-subtle)}
.chip[aria-pressed="true"]{background:var(--background-color-interactive-strong);border-color:var(--background-color-interactive-strong);
  color:var(--foreground-color-interactive-on-strong)}
.chip[aria-pressed="true"] b{color:inherit}

/* Rentemelding (oud of melding van de rentebron) */
.melding{display:flex;gap:var(--spacing-100);align-items:flex-start;padding:var(--spacing-100) var(--spacing-150);
  border-left:2px solid var(--foreground-color-feedback-notice);background:var(--background-color-feedback-notice-weak);
  color:var(--status-tekst);font:var(--paragraph-body-small);border-radius:0 var(--radius-100) var(--radius-100) 0}
.melding .ic{color:var(--foreground-color-feedback-notice);margin-top:var(--spacing-25)}
.melding u{font-weight:600}
.rente-melding{margin-top:var(--spacing-50);min-height:var(--tap);text-decoration:none}

/* Secties en groepen */
.sectie{margin-top:var(--spacing-150)}
.sectie-kop{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top));z-index:20;display:flex;gap:var(--spacing-100);
  padding:var(--spacing-100) var(--spacing-25);background:var(--background-color-page);font:var(--paragraph-title-medium);
  color:var(--foreground-color-strong);list-style:none;cursor:default;min-height:var(--tap);align-items:center}
.sectie-kop::-webkit-details-marker{display:none}
.sectie-kop .tel{font:var(--paragraph-body-small);color:var(--foreground-color-subtle)}
.sectie-kop .ic{color:var(--foreground-color-subtle)}
details.groep>.sectie-kop{cursor:pointer}
details.groep>.sectie-kop .chev{margin-left:auto;transition:transform .15s}
details.groep[open]>.sectie-kop .chev{transform:rotate(180deg)}
.sectie-leeg{font:var(--paragraph-body-small);color:var(--foreground-color-subtle);padding:var(--spacing-100) var(--spacing-25) var(--spacing-150)}
.kaarten{display:grid;gap:var(--spacing-150)}
.groep-uitleg{font:var(--paragraph-body-small);color:var(--foreground-color-subtle);padding:0 var(--spacing-25) var(--spacing-100)}
.eerder-kop{margin-top:var(--spacing-300)}

/* Woningkaart: radius-200, 1 px rand, geen schaduw */
.woning{background:var(--background-color-default);border:1px solid var(--border-color-subtle);border-radius:var(--radius-200);
  overflow:hidden;scroll-margin-top:calc(var(--top-h) + var(--tap) + var(--spacing-200))}
.woning.is-uitgelicht{outline:2px solid var(--border-color-interactive-focus);outline-offset:2px}
.woning.is-verborgen{opacity:.6}
/* Statusregel: vlak, gekleurde rand en icoon, neutrale tekst */
.w-status{display:flex;gap:var(--spacing-100);align-items:flex-start;padding:var(--spacing-100) var(--spacing-150);
  border-left:4px solid;color:var(--status-tekst);font:var(--paragraph-body-status)}
.w-status .ic{margin-top:var(--spacing-25)}
.w-status strong{font-weight:600}
.w-scenario{display:block;font:var(--paragraph-body-small)}
.st-PAST{background:var(--background-color-feedback-positive-weak);border-color:var(--foreground-color-feedback-positive)}
.st-PAST .ic{color:var(--foreground-color-feedback-positive)}
.st-KRAP{background:var(--background-color-feedback-notice-weak);border-color:var(--foreground-color-feedback-notice)}
.st-KRAP .ic{color:var(--foreground-color-feedback-notice)}
.st-NIET{background:var(--background-color-feedback-negative-weak);border-color:var(--foreground-color-feedback-negative)}
.st-NIET .ic{color:var(--foreground-color-feedback-negative)}
.st-ONBEKEND{background:var(--background-color-feedback-informative-weak);border-color:var(--foreground-color-feedback-informative)}
.st-ONBEKEND .ic{color:var(--foreground-color-feedback-informative)}

.w-kern{display:grid;grid-template-columns:5.5rem 1fr;gap:var(--spacing-150);padding:var(--spacing-150) var(--spacing-150) 0}
.w-foto{width:5.5rem;height:5.5rem;border-radius:var(--radius-100);overflow:hidden;background:var(--background-color-inset);
  display:grid;place-items:center;color:var(--foreground-color-subtle)}
.w-foto img{width:100%;height:100%;object-fit:cover}
.w-tekst{min-width:0;display:grid;gap:var(--spacing-25);align-content:start}
.w-titelrij{display:flex;align-items:flex-start;gap:var(--spacing-50)}
.w-titel{font:var(--heading-small);color:var(--foreground-color-neutral);flex:1;min-width:0;padding-top:var(--spacing-25);overflow-wrap:anywhere}
.w-bewaar{margin:calc(var(--spacing-100) * -1) calc(var(--spacing-100) * -1) 0 0;color:var(--foreground-color-subtle)}
.w-bewaar .ic{width:1.5rem;height:1.5rem}
.w-bewaar[aria-pressed="true"]{color:var(--foreground-color-strong)}
.w-bewaar[aria-pressed="true"] .ic{fill:currentColor}
.w-buurt,.w-feit,.w-reis{font:var(--paragraph-body-small);color:var(--foreground-color-subtle)}
.w-feit{color:var(--foreground-color-neutral)}
.w-reis{display:flex;align-items:center;gap:var(--spacing-50)}
.w-labels{display:flex;flex-wrap:wrap;gap:var(--spacing-50);margin-top:var(--spacing-25)}
.lbl{display:inline-flex;align-items:center;min-height:1.5rem;padding:0 var(--spacing-100);border-radius:var(--radius-100);
  font:var(--label-small);color:var(--label-tekst)}
.lbl-daling{background:var(--label-daling)} .lbl-lang{background:var(--label-lang)}

/* Kerncijfers op een vaste plek */
.w-cijfers{display:grid;grid-template-columns:1.25fr 1.1fr .8fr;gap:var(--spacing-100);margin:var(--spacing-150) var(--spacing-150) 0;
  padding-top:var(--spacing-100);border-top:1px solid var(--border-color-subtle)}
.w-cijfers>div{min-width:0;display:grid;align-content:start}
.w-cijfers dt{font:var(--paragraph-body-xsmall);color:var(--foreground-color-subtle)}
.w-cijfers dd{font:var(--cijfer-groot);color:var(--foreground-color-neutral);white-space:nowrap}
.w-cijfers dd.sub{font:var(--paragraph-body-xsmall);color:var(--foreground-color-subtle);white-space:normal}
.w-cijfers dd.cijfer-leeg{font:var(--paragraph-title-compact);color:var(--foreground-color-subtle);padding-top:var(--spacing-25)}
.w-cijfers .score-w{color:var(--foreground-color-highlight-strong)}

.w-twijfel{display:flex;gap:var(--spacing-75);align-items:flex-start;margin:var(--spacing-150) var(--spacing-150) 0;
  font:var(--paragraph-body-small);color:var(--foreground-color-neutral)}
.w-twijfel .ic{color:var(--foreground-color-feedback-notice);margin-top:var(--spacing-25)}
/* Waarom: zwaarste onderdelen van de score, teken in een rondje */
.w-waarom{display:flex;flex-wrap:wrap;gap:var(--spacing-50) var(--spacing-150);margin:var(--spacing-100) var(--spacing-150) 0;
  font:var(--paragraph-body-small)}
.r{display:inline-flex;align-items:center;gap:var(--spacing-50)}
.r::before{display:inline-grid;place-items:center;width:1rem;height:1rem;flex:none;border-radius:50%;
  color:var(--background-color-default);font:var(--teken)}
.r-plus::before{content:"+";background:var(--foreground-color-feedback-positive)}
.r-min::before{content:"\2212";background:var(--foreground-color-feedback-negative)}
.r-onb{color:var(--foreground-color-subtle)}
.r-onb::before{display:none}

/* Kaartvoet: tweede laag, Bekijk op funda en Verberg */
.w-voet{position:relative;margin-top:var(--spacing-100)}
.w-acties{position:absolute;top:0;right:0;display:flex;align-items:center;height:var(--knop);padding-right:var(--spacing-50)}
.w-acties .icoonknop{color:var(--foreground-color-interactive-strong)}
.w-meer>summary{display:flex;align-items:center;gap:var(--spacing-100);min-height:var(--knop);padding:0 calc(var(--tap) * 2 + var(--spacing-200)) 0 var(--spacing-150);
  cursor:pointer;list-style:none;font:var(--paragraph-title-compact);color:var(--foreground-color-interactive-strong);
  border-top:1px solid var(--border-color-subtle)}
.w-meer>summary::-webkit-details-marker{display:none}
.w-meer>summary .chev{transition:transform .15s}
.w-meer[open]>summary .chev{transform:rotate(180deg)}
.w-meer>summary .tel-lo{color:var(--foreground-color-neutral);font-weight:400}
.w-laag2{display:grid;gap:var(--spacing-300);padding:var(--spacing-100) var(--spacing-150) var(--spacing-200)}
.fotostrip{display:flex;gap:var(--spacing-100);overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--spacing-150) * -1);
  padding:0 var(--spacing-150)}
.fotostrip img{flex:none;width:85%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--radius-100);scroll-snap-align:start}
.blok h4{font:var(--paragraph-title-compact);color:var(--foreground-color-strong);margin:0 0 var(--spacing-75);
  display:flex;align-items:center;gap:var(--spacing-75)}
.blok h4 .tel{font-weight:400;color:var(--foreground-color-subtle)}
.punten{display:grid}
.punt{display:grid;grid-template-columns:1.25rem 1fr auto;gap:var(--spacing-100);align-items:start;padding:var(--spacing-75) 0;
  border-bottom:1px solid var(--border-color-subtle)}
.punt:last-child{border-bottom:0}
.punt .ic{margin-top:var(--spacing-25)}
.punt-tekst{font:var(--paragraph-body-small);min-width:0}
.punt-tekst b{font-weight:600}
.punt-tekst .bron{display:block;color:var(--foreground-color-subtle);font:var(--paragraph-body-xsmall)}
.punt-tekst .uitleg{display:block;margin-top:var(--spacing-25)}
.punt-tekst .vraag{display:flex;gap:var(--spacing-50);align-items:flex-start;margin-top:var(--spacing-25);font-style:italic}
.punt-tekst .vraag .ic{margin-top:var(--spacing-25);color:var(--foreground-color-subtle)}
.pt{font:var(--paragraph-title-small);white-space:nowrap}
.pt-plus{color:var(--foreground-color-feedback-positive)} .pt-min{color:var(--foreground-color-feedback-negative)}
.pt-nul{color:var(--foreground-color-subtle);font-weight:400}
.o-sterk{color:var(--foreground-color-feedback-negative)} .o-let_op{color:var(--foreground-color-feedback-notice)}
.o-goed{color:var(--foreground-color-feedback-positive)} .o-onbekend,.o-kans,.o-neutraal{color:var(--foreground-color-feedback-informative)}
.gesch{color:var(--foreground-color-subtle);font-weight:400}

/* Opbouw score en woonlasten */
.opbouw{border:1px solid var(--border-color-subtle);border-radius:var(--radius-200)}
.opbouw>summary{display:flex;align-items:center;gap:var(--spacing-100);min-height:var(--tap);padding:0 var(--spacing-150);cursor:pointer;
  list-style:none;font:var(--paragraph-title-compact)}
.opbouw>summary::-webkit-details-marker{display:none}
.opbouw>summary .chev{margin-left:auto;transition:transform .15s;color:var(--foreground-color-subtle)}
.opbouw[open]>summary .chev{transform:rotate(180deg)}
.opbouw>summary .waarde{font-weight:400;color:var(--foreground-color-subtle)}
.scorezin{padding:0 var(--spacing-150) var(--spacing-100);font:var(--paragraph-body-small)}
.rekensom{padding:0 var(--spacing-150) var(--spacing-150);font:var(--paragraph-body-small)}
.rekensom>div{display:grid;grid-template-columns:1fr 3.5rem 4.5rem;gap:var(--spacing-100);align-items:center;padding:var(--spacing-50) 0}
.rekensom.geld>div{grid-template-columns:1fr auto}
.rekensom dt{min-width:0}
.rekensom dd{text-align:right;font-weight:600}
.rekensom .som{border-top:1px solid var(--border-color-default);margin-top:var(--spacing-50);padding-top:var(--spacing-100);font-weight:600}
.balk{display:block;position:relative;height:.5rem;background:var(--background-color-inset);border-radius:var(--radius-pill)}
.balk::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--border-color-interactive-neutral)}
.balk i{position:absolute;top:0;bottom:0;border-radius:var(--radius-pill)}
.balk .bp{left:50%;background:var(--foreground-color-feedback-positive)}
.balk .bm{right:50%;background:var(--foreground-color-feedback-negative)}
.b1{width:5%} .b2{width:10%} .b3{width:15%} .b4{width:20%} .b5{width:25%} .b6{width:30%} .b7{width:35%} .b8{width:40%} .b9{width:45%} .b10{width:50%}
.geld-blok{display:grid;gap:var(--spacing-150)}
.kenmerken{display:grid;grid-template-columns:auto 1fr;gap:var(--spacing-50) var(--spacing-200);font:var(--paragraph-body-small)}
.kenmerken dt{color:var(--foreground-color-subtle)}
.vragen{display:grid;gap:var(--spacing-75);font:var(--paragraph-body-small);counter-reset:v}
.vragen li{display:grid;grid-template-columns:1.25rem 1fr;gap:var(--spacing-75)}
.vragen li::before{counter-increment:v;content:counter(v) ".";color:var(--foreground-color-subtle)}
.acties{display:flex;flex-wrap:wrap;gap:var(--spacing-100)}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-100);min-height:var(--knop);padding:0 var(--spacing-200);
  border-radius:var(--radius-100);font:var(--paragraph-title-medium);text-decoration:none;cursor:pointer;border:1px solid transparent}
.knop-sec{background:var(--background-color-interactive-strong);color:var(--foreground-color-interactive-on-strong)}
.knop-ter{background:transparent;border-color:var(--border-color-interactive-neutral);color:var(--foreground-color-interactive-strong)}
/* Hover alleen met een muis: op iOS blijft :hover na een tik staan en lijkt de knop dan actief. */
@media (hover:hover){
  .app-top .icoonknop:hover{background:var(--background-color-on-strong-hover)}
  .knop-sec:hover{background:var(--background-color-interactive-strong-hover)}
  .knop-ter:hover{background:var(--background-color-interactive-weak)}
}
.knop-vol{flex:1 1 12rem}
.knop[disabled]{opacity:.5;cursor:default}

/* Bewaard: lichte shortlist */
.bewaard-balk{display:flex;align-items:center;gap:var(--spacing-150);margin-top:var(--spacing-150);
  padding:var(--spacing-100) var(--spacing-100) var(--spacing-100) var(--spacing-200);border-radius:var(--radius-200);
  background:var(--background-color-default);border:1px solid var(--border-color-subtle);font:var(--paragraph-body-small)}
.bewaard-balk span{flex:1}
.bewaard-balk .knop{min-height:var(--tap)}
.top-tel{font:var(--paragraph-body-small);color:var(--foreground-color-on-strong-subtle);margin-left:var(--spacing-75)}
/* Lege toestand */
.leeg{margin-top:var(--spacing-300);padding:var(--spacing-300) var(--spacing-200);border-radius:var(--radius-200);
  background:var(--background-color-default);border:1px solid var(--border-color-subtle);display:grid;gap:var(--spacing-150);justify-items:start}
.leeg h2{font:var(--heading-small);color:var(--foreground-color-strong)}
.leeg p{font:var(--paragraph-body-small);color:var(--foreground-color-subtle)}

/* Voet: budget, meldingen, bronnen, verborgen */
.voet{margin-top:var(--spacing-400);display:grid;gap:var(--spacing-150)}
.voet .opbouw{background:var(--background-color-default)}
.voet .tekst{padding:0 var(--spacing-150) var(--spacing-150);font:var(--paragraph-body-small);display:grid;gap:var(--spacing-100)}
.voet .tekst ul{display:grid;gap:var(--spacing-50);padding-left:var(--spacing-200);list-style:disc}
.verborgen-regel{font:var(--paragraph-body-small);color:var(--foreground-color-subtle);display:flex;align-items:center;gap:var(--spacing-100)}
.linkknop{background:none;border:0;padding:0 var(--spacing-100);min-height:var(--tap);color:var(--foreground-color-interactive-strong);
  text-decoration:underline;cursor:pointer;font:inherit}
/* Meldingen (push) */
.push-uitvoer{width:100%;min-height:8rem;padding:var(--spacing-100);border:1px solid var(--border-color-interactive-neutral);
  border-radius:var(--radius-100);background:var(--background-color-inset);color:var(--foreground-color-neutral);font:var(--paragraph-body-small)}
.push-status{color:var(--foreground-color-subtle)}
.push-status.is-fout{color:var(--foreground-color-feedback-negative)}
.push-status:empty{display:none}

/* Onderbalk (duimbereik, alleen mobiel) */
.app-onder{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--background-color-default);
  border-top:1px solid var(--border-color-default);padding:var(--spacing-75) max(var(--spacing-150),env(safe-area-inset-right))
  calc(var(--spacing-75) + env(safe-area-inset-bottom)) max(var(--spacing-150),env(safe-area-inset-left))}
.app-onder-in{display:flex;gap:var(--spacing-100);align-items:center;max-width:40rem;margin:0 auto}
.onderknop{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-75);min-height:var(--knop);padding:0 var(--spacing-150);
  border-radius:var(--radius-100);border:1px solid var(--border-color-interactive-neutral);background:var(--background-color-default);
  color:var(--foreground-color-interactive-strong);font:var(--paragraph-title-compact);cursor:pointer;flex:1}
.teller{display:inline-grid;place-items:center;min-width:1.25rem;height:1.25rem;padding:0 var(--spacing-50);border-radius:var(--radius-pill);
  background:var(--background-color-interactive-strong);color:var(--foreground-color-interactive-on-strong);font:var(--teken)}
.wissel{display:flex;flex:1.4;border:1px solid var(--border-color-interactive-neutral);border-radius:var(--radius-100);overflow:hidden}
.wissel button{flex:1;min-height:var(--knop);border:0;background:var(--background-color-default);color:var(--foreground-color-interactive-strong);
  font:var(--paragraph-title-compact);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-50)}
.wissel button[aria-pressed="true"]{background:var(--background-color-interactive-strong);color:var(--foreground-color-interactive-on-strong)}

/* Kaart */
.kaart-paneel{display:none;background:var(--background-color-inset)}
.app[data-view="kaart"] .kaart-paneel{display:block;position:fixed;z-index:50;left:0;right:0;
  top:calc(var(--top-h) + env(safe-area-inset-top));bottom:calc(var(--onder-h) + env(safe-area-inset-bottom))}
.app[data-view="kaart"] .app-main{visibility:hidden;height:0;overflow:hidden}
#kaart{position:absolute;inset:0}
.kaart-legenda{position:absolute;z-index:500;left:var(--spacing-150);bottom:calc(var(--spacing-150) + 1.5rem);   /* boven de bronvermelding */
  display:flex;flex-wrap:wrap;gap:var(--spacing-50) var(--spacing-150);
  padding:var(--spacing-100) var(--spacing-150);border-radius:var(--radius-200);background:var(--background-color-default);
  border:1px solid var(--border-color-default);font:var(--paragraph-body-small);max-width:calc(100% - var(--spacing-300))}
.kaart-legenda span{display:inline-flex;align-items:center;gap:var(--spacing-50)}
.kaart-melding{position:absolute;inset:0;display:grid;place-items:center;padding:var(--spacing-300);text-align:center;
  font:var(--paragraph-body-small);color:var(--foreground-color-subtle)}
.pin-raak{display:grid;place-items:center}
.pin{display:inline-flex;align-items:center;justify-content:center;gap:var(--spacing-25);min-width:2.5rem;height:2rem;
  padding:0 var(--spacing-75) 0 var(--spacing-50);border-radius:var(--radius-pill);
  border:2px solid var(--pin-rand);font:var(--paragraph-title-small);color:var(--pin-tekst);white-space:nowrap}
.pin.p-PAST,.lp.p-PAST{background:var(--pin-past)} .pin.p-KRAP,.lp.p-KRAP{background:var(--pin-krap)}
.pin.p-NIET,.lp.p-NIET{background:var(--pin-niet)} .pin.p-ONBEKEND,.lp.p-ONBEKEND{background:var(--pin-onbekend)}
.pin.p-KRAP{color:var(--pin-tekst-krap)}
.pin.is-nieuw{outline:3px solid var(--pin-nieuw);outline-offset:0}
/* Poort op de pin ook zonder kleur: icoon voor de score */
.pin .ic,.lp .ic{width:.875rem;height:.875rem;stroke-width:2.5}
.lp{display:inline-grid;place-items:center;width:1.375rem;height:1.375rem;border-radius:50%;border:2px solid var(--pin-rand);
  outline:1px solid var(--border-color-default);color:var(--pin-tekst)}
.lp.p-KRAP{color:var(--pin-tekst-krap)}
.lp.is-nieuw{outline:3px solid var(--foreground-color-strong);outline-offset:-1px;background:transparent}
.leaflet-container{font:var(--paragraph-body-small);background:var(--background-color-inset)}
.leaflet-touch .leaflet-bar a{width:var(--tap);height:var(--tap);line-height:var(--tap)}
.leaflet-popup-content-wrapper{border-radius:var(--radius-200);background:var(--background-color-default);color:var(--foreground-color-neutral)}
.leaflet-popup-tip{background:var(--background-color-default)}
.leaflet-popup-content{margin:var(--spacing-150);min-width:13rem}
.leaflet-container a.leaflet-popup-close-button{width:var(--tap);height:var(--tap);font:var(--icoon-sluit)}
.pop h3{font:var(--paragraph-title-medium);padding-right:var(--spacing-300)}
.pop p{font:var(--paragraph-body-small);margin:var(--spacing-50) 0}
.pop .knop{min-height:var(--tap);width:100%;margin-top:var(--spacing-100);font:var(--paragraph-title-compact)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.78) contrast(1.08) saturate(.85)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.78) contrast(1.08) saturate(.85)}

/* Sheets (dialog, alleen na een tik) */
dialog.sheet{border:0;padding:0;margin:auto 0 0;width:100%;max-width:100%;max-height:88vh;border-radius:var(--radius-200) var(--radius-200) 0 0;
  background:var(--background-color-default);color:var(--foreground-color-neutral);display:none;flex-direction:column}
dialog.sheet[open]{display:flex}
dialog.sheet::backdrop{background:rgba(11,17,32,.55)}
.sheet-kop{display:flex;align-items:center;gap:var(--spacing-100);padding:var(--spacing-100) var(--spacing-100) var(--spacing-100) var(--spacing-200);
  border-bottom:1px solid var(--border-color-subtle)}
.sheet-kop h2{font:var(--heading-app);flex:1;color:var(--foreground-color-strong)}
/* Alleen de body scrollt: kop met Sluiten en voet met Toon n woningen blijven in beeld. */
.sheet>form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.sheet-kop,.sheet-voet{flex:none}
.sheet-body{overflow:auto;padding:var(--spacing-200);display:grid;gap:var(--spacing-300);flex:1 1 auto;min-height:0}
.sheet-voet{display:flex;gap:var(--spacing-100);padding:var(--spacing-150) var(--spacing-200) calc(var(--spacing-150) + env(safe-area-inset-bottom));
  border-top:1px solid var(--border-color-subtle)}
.sheet-voet .knop{flex:1}
fieldset{border:0;margin:0;padding:0;display:grid;gap:var(--spacing-50)}
legend{font:var(--paragraph-title-medium);color:var(--foreground-color-strong);margin-bottom:var(--spacing-50);padding:0}
.keuze{display:flex;align-items:center;gap:var(--spacing-150);min-height:var(--tap);cursor:pointer;font:var(--paragraph-body-medium)}
/* Radio en checkbox zelf getekend (standaard haalt in donker geen 3:1) */
.keuze input{appearance:none;-webkit-appearance:none;width:1.375rem;height:1.375rem;margin:0;flex:none;display:grid;place-items:center;
  border:2px solid var(--border-color-interactive-neutral);background:var(--background-color-default);cursor:pointer}
.keuze input[type="radio"]{border-radius:50%}
.keuze input[type="checkbox"]{border-radius:var(--radius-100)}
.keuze input:checked{border-color:var(--background-color-interactive-strong);background:var(--background-color-interactive-strong)}
.keuze input[type="radio"]:checked::after{content:"";width:.625rem;height:.625rem;border-radius:50%;background:var(--foreground-color-interactive-on-strong)}
.keuze input[type="checkbox"]:checked::after{content:"";width:.375rem;height:.75rem;border:solid var(--foreground-color-interactive-on-strong);
  border-width:0 2px 2px 0;transform:translateY(-.0625rem) rotate(45deg)}
.keuze small,.schakel small{color:var(--foreground-color-subtle);font:var(--paragraph-body-small)}
.veld{display:grid;gap:var(--spacing-50)}
.veld label{font:var(--paragraph-title-small);display:flex;align-items:flex-end;min-height:var(--tap)}
.veld input{min-height:var(--knop);padding:0 var(--spacing-150);border:0;border-bottom:1px solid var(--border-color-interactive-neutral);
  border-radius:var(--radius-100) var(--radius-100) 0 0;background:var(--background-color-inset);color:var(--foreground-color-neutral);
  font:var(--paragraph-body-medium);width:100%}
.veld input::placeholder{color:var(--foreground-color-subtle);opacity:1}
.velden{display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-150)}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-150);min-height:var(--tap);cursor:pointer;font:var(--paragraph-body-medium)}
.schakel input{appearance:none;-webkit-appearance:none;width:3rem;height:1.75rem;border-radius:var(--radius-pill);margin:0;flex:none;
  background:var(--background-color-subtle);border:1px solid var(--border-color-interactive-neutral);position:relative;cursor:pointer}
.schakel input::after{content:"";position:absolute;top:.1875rem;left:.1875rem;width:1.25rem;height:1.25rem;border-radius:50%;
  background:var(--foreground-color-subtle);transition:transform .15s}
.schakel input:checked{background:var(--background-color-interactive-strong);border-color:var(--background-color-interactive-strong)}
.schakel input:checked::after{transform:translateX(1.25rem);background:var(--foreground-color-interactive-on-strong)}

/* Vergelijken */
.vergelijk-wrap{overflow-x:auto;margin:0 calc(var(--spacing-200) * -1);padding:0 var(--spacing-200)}
.vergelijk{border-collapse:separate;border-spacing:0;font:var(--paragraph-body-small);min-width:100%}
.vergelijk th,.vergelijk td{padding:var(--spacing-100);text-align:left;vertical-align:top;border-bottom:1px solid var(--border-color-subtle);min-width:9rem}
.vergelijk thead th{font:var(--paragraph-title-small);color:var(--foreground-color-neutral)}
.vergelijk tbody th{position:sticky;left:0;background:var(--background-color-default);color:var(--foreground-color-subtle);font-weight:400;min-width:6.5rem;width:6.5rem}
.vergelijk .beste{font-weight:600}
.vergelijk .beste::after{content:" (beste)";font-weight:400;color:var(--foreground-color-subtle)}

/* Toast (merkvlak) */
.toast{position:fixed;left:var(--spacing-200);right:var(--spacing-200);margin:0 auto;width:fit-content;max-width:30rem;
  bottom:calc(var(--onder-h) + env(safe-area-inset-bottom) + var(--spacing-150));z-index:300;
  display:flex;align-items:center;gap:var(--spacing-100);padding:var(--spacing-50) var(--spacing-50) var(--spacing-50) var(--spacing-200);
  border-radius:var(--radius-200);font:var(--paragraph-body-small)}
.toast .linkknop{color:var(--foreground-color-on-strong);font-weight:600}

/* Desktop (vanaf 64rem): kaart in een plakkende zijkolom */
@media (min-width:64rem){
  :root{--onder-h:0rem}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:var(--spacing-300);padding:0 var(--spacing-300) var(--spacing-400)}
  .app-onder{display:none}
  .app-zij{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--spacing-150);position:sticky;top:calc(var(--top-h) + var(--spacing-150));
    height:calc(100vh - var(--top-h) - var(--spacing-300));padding-top:var(--spacing-150)}
  .kaart-paneel,.app[data-view="kaart"] .kaart-paneel{display:block;position:relative;inset:auto;min-height:20rem;border-radius:var(--radius-200);
    overflow:hidden;border:1px solid var(--border-color-subtle)}
  .app-zij .kaart-paneel{height:100%}
  .zij-kop{display:flex;gap:var(--spacing-100)}
  .zij-kop .knop{flex:1 1 auto;white-space:nowrap;padding:0 var(--spacing-150)}
  .app[data-view="kaart"] .app-main{visibility:visible;height:auto;overflow:visible}
  .w-kern{grid-template-columns:10rem 1fr;gap:var(--spacing-200);padding:var(--spacing-200) var(--spacing-200) 0}
  .w-foto{width:10rem;height:7.5rem}
  .w-status{padding:var(--spacing-100) var(--spacing-200)}
  .w-cijfers{grid-template-columns:repeat(3,minmax(0,10rem));margin-left:calc(10rem + var(--spacing-400));margin-right:var(--spacing-200);margin-top:var(--spacing-100)}
  .w-waarom,.w-twijfel{margin-left:calc(10rem + var(--spacing-400));margin-right:var(--spacing-200)}
  .w-meer>summary{padding-left:var(--spacing-200)}
  .w-acties{padding-right:var(--spacing-100)}
  .w-laag2{padding:var(--spacing-100) var(--spacing-200) var(--spacing-200);grid-template-columns:1fr 1fr;column-gap:var(--spacing-300)}
  .w-laag2>.breed{grid-column:1/-1}
  .fotostrip img{width:48%}
  dialog.sheet{margin:0 0 0 auto;height:100vh;max-height:100vh;width:26rem;border-radius:0}
  #vergelijk.sheet{margin:auto;height:auto;max-height:90vh;width:min(56rem,90vw);border-radius:var(--radius-200)}
  .toast{bottom:var(--spacing-300)}
}
@media print{.app-top,.app-onder,.app-zij,.snel,.w-bewaar,.w-acties{display:none}.w-meer{display:block}}

/* Slotscherm: publiek leesbaar. Geen naam, geen merkvorm. */
#content[hidden],.slot[hidden]{display:none}
.slot{min-height:100vh;display:grid;place-items:center;background:var(--background-color-page);
  padding:calc(var(--spacing-300) + env(safe-area-inset-top)) var(--spacing-200) calc(var(--spacing-300) + env(safe-area-inset-bottom))}
.slot-tegel{width:min(22.5rem,100%);padding:var(--spacing-300);border-radius:var(--radius-200);background:var(--background-color-default);
  border:1px solid var(--border-color-subtle);display:grid;gap:var(--spacing-200)}

  background:var(--background-color-strong);color:var(--foreground-color-on-strong)}

  bottom:calc(var(--onder-h) + env(safe-area-inset-bottom) + var(--spacing-150));padding:var(--spacing-100) var(--spacing-200);
  border-radius:var(--radius-200);font:var(--paragraph-body-small)}

</style>
<script>/* Woningrapport: filteren, sorteren, nieuw, bewaren, verbergen, vergelijken, kaart. Geen netwerk; opslag
   in localStorage. Het slotscherm roept na het ontsleutelen window.fundaAfterReportLoad() aan. */
(function(){
'use strict';
var OPSLAG = 'funda_rapport_v1';
var POORT_RANG = {'PAST':0,'KRAP':1,'PAST NIET':2,'PRIJS ONBEKEND':3};
var POORT_CLS = {'PAST':'PAST','KRAP':'KRAP','PAST NIET':'NIET','PRIJS ONBEKEND':'ONBEKEND'};
var POORT_IC = {'PAST':'check','KRAP':'warn','PAST NIET':'x','PRIJS ONBEKEND':'info'};
var STANDAARD = {sort:'aanbevolen', snel:'alles', poort:[], stad:[], maxLasten:'', minM2:'', zonderTwijfel:false, toonVerborgen:false};

function lees(){ try { return JSON.parse(localStorage.getItem(OPSLAG)) || {}; } catch(e){ return {}; } }
function schrijf(s){ try { localStorage.setItem(OPSLAG, JSON.stringify(s)); } catch(e){} }
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
// € met een harde spatie (U+00A0)
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }).replace(/€ /g, '€\u00a0'); }
function eur(n){ return n==null ? '' : '€\u00a0' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
// 'Past nu' -> 'past nu', achter 'Financiering:' (funda_ui.scenario_regel)
function finTekst(t){ t = String(t || ''); return t.charAt(0).toLowerCase() + t.slice(1); }

var app, data, opslag, stand, nieuwIds, kaart = null;

function init(){
  app = $('#app');
  if(!app || app.dataset.klaar) return;
  app.dataset.klaar = '1';
  try { data = JSON.parse($('#woning-data').textContent); } catch(e){ data = {woningen:[]}; }
  opslag = lees();
  stand = Object.assign({}, STANDAARD, opslag.stand || {});
  opslag.bewaard = opslag.bewaard || [];
  opslag.verborgen = opslag.verborgen || [];
  bepaalNieuw();
  koppel();
  zetFormulier();
  toepassen();
  apparaat();
  if(window.matchMedia('(min-width:64rem)').matches) startKaart();
}

/* Nieuw sinds je vorige bezoek (anders: volgens de run). Gezien na een seconde half in beeld tussen
   de balken (zonder IntersectionObserver nooit). Wat nu niet nieuw is, is meteen bekend. */
var GEZIEN_DEEL = 0.5, GEZIEN_MS = 1000;
function bepaalNieuw(){
  var run = app.dataset.run, sessieSleutel = 'funda_rapport_nieuw_' + run, bron = 'run';
  var ids = data.woningen.map(function(w){ return w.id; });
  var gezien = (opslag.gezien || []).filter(function(id){ return ids.indexOf(id) >= 0; });
  var bewaardInSessie = null;
  try { bewaardInSessie = JSON.parse(sessionStorage.getItem(sessieSleutel)); } catch(e){}
  if(bewaardInSessie){ nieuwIds = bewaardInSessie.ids; bron = bewaardInSessie.bron; }
  else if(opslag.gezien && opslag.gezien.length){
    nieuwIds = ids.filter(function(id){ return gezien.indexOf(id) < 0; }); bron = 'bezoek';
  } else {
    nieuwIds = data.woningen.filter(function(w){ return w.nieuw_run; }).map(function(w){ return w.id; });
  }
  try { sessionStorage.setItem(sessieSleutel, JSON.stringify({ids:nieuwIds, bron:bron})); } catch(e){}
  // Alleen woningen uit deze run bewaren: zo groeit de lijst niet.
  ids.forEach(function(id){ if(nieuwIds.indexOf(id) < 0 && gezien.indexOf(id) < 0) gezien.push(id); });
  opslag.gezien = gezien; schrijf(opslag);
  var kop = $('#nieuw-titel');
  if(kop) kop.textContent = bron === 'bezoek' ? 'Nieuw sinds je vorige bezoek' : 'Nieuw sinds de vorige run';
  var leeg = $('#nieuw-leeg');
  if(leeg && opslag.laatsteBezoek) leeg.textContent = 'Geen nieuwe woningen sinds je vorige bezoek (' + opslag.laatsteBezoek + ').';
  function bezoek(){
    var nu = new Date();
    opslag.laatsteBezoek = nu.toLocaleDateString('nl-NL', {day:'numeric', month:'short'}) + ', ' +
      nu.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
    schrijf(opslag);
  }
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden'){ bezoek(); volgGezien.stop(); } });
  window.addEventListener('pagehide', bezoek);
  volgGezien(nieuwIds.filter(function(id){ return gezien.indexOf(id) < 0; }));
}
function markeerGezien(id){
  if(!opslag.gezien) opslag.gezien = [];
  if(opslag.gezien.indexOf(id) < 0){ opslag.gezien.push(id); schrijf(opslag); }
}
/* In beeld: half de kaart, of bij een kaart hoger dan het scherm half het scherm. */
function volgGezien(teVolgen){
  var klokken = {};
  volgGezien.stop = function(){ for(var id in klokken){ clearTimeout(klokken[id]); } klokken = {}; };
  if(!teVolgen.length || !('IntersectionObserver' in window)) return;
  var drempels = []; for(var i = 0; i <= 20; i++) drempels.push(i / 20);
  var io = new IntersectionObserver(function(regels){
    regels.forEach(function(r){
      var id = r.target.dataset.id;
      var hoog = r.rootBounds ? r.rootBounds.height : window.innerHeight;
      var inBeeld = r.isIntersecting && (r.intersectionRatio >= GEZIEN_DEEL || r.intersectionRect.height >= hoog * GEZIEN_DEEL);
      if(inBeeld && document.visibilityState !== 'hidden'){
        if(!klokken[id]) klokken[id] = setTimeout(function(){
          delete klokken[id]; markeerGezien(id); io.unobserve(r.target);
        }, GEZIEN_MS);
      } else if(klokken[id]){ clearTimeout(klokken[id]); delete klokken[id]; }
    });
  }, {threshold: drempels, rootMargin: balkMarge()});
  $$('.woning').forEach(function(k){ if(teVolgen.indexOf(k.dataset.id) >= 0) io.observe(k); });
}
volgGezien.stop = function(){};
/* Onder de top- en onderbalk is niet in beeld. */
function balkMarge(){
  function hg(sel){ var el = $(sel); return el ? Math.round(el.getBoundingClientRect().height) : 0; }
  return '-' + hg('.app-top') + 'px 0px -' + hg('.app-onder') + 'px 0px';
}

function woningVan(id){ for(var i=0;i<data.woningen.length;i++) if(data.woningen[i].id===id) return data.woningen[i]; return null; }

function past(w){
  var s = stand;
  var verborgen = opslag.verborgen.indexOf(w.id) >= 0;
  if(verborgen && !s.toonVerborgen) return false;
  if(s.snel === 'nieuw' && nieuwIds.indexOf(w.id) < 0) return false;
  if(s.snel === 'past' && w.poort !== 'PAST') return false;
  if(s.snel === 'krap' && w.poort !== 'KRAP') return false;
  if(s.snel === 'gedaald' && !w.gedaald) return false;
  if(s.snel === 'bewaard' && opslag.bewaard.indexOf(w.id) < 0) return false;
  if(s.poort.length && s.poort.indexOf(w.poort) < 0) return false;
  if(s.stad.length && s.stad.indexOf(w.stad) < 0) return false;
  if(s.maxLasten && w.netto != null && w.netto > +s.maxLasten) return false;
  if(s.minM2 && (w.m2 || 0) < +s.minM2) return false;
  if(s.zonderTwijfel && w.twijfel) return false;
  return true;
}

/* Zonder vraagprijs altijd achteraan, bij elke sortering (ook een veiling op PAST NIET). */
function onbekendAchter(f){
  return function(a,b){ return (!(a.prijs>0)-!(b.prijs>0)) || f(a,b); };
}
var SORT = {
  aanbevolen: function(a,b){ return (POORT_RANG[a.poort]-POORT_RANG[b.poort]) || ((a.twijfel?1:0)-(b.twijfel?1:0)) || (b.score-a.score); },
  score: function(a,b){ return b.score-a.score; },
  woonlasten: function(a,b){ return (a.netto==null?1e9:a.netto)-(b.netto==null?1e9:b.netto); },
  prijs: function(a,b){ return (a.prijs||1e9)-(b.prijs||1e9); },
  reis: function(a,b){ return (a.reis_min==null?1e9:a.reis_min)-(b.reis_min==null?1e9:b.reis_min); },
  nieuwst: function(a,b){ return (a.dagen==null?1e9:a.dagen)-(b.dagen==null?1e9:b.dagen); }
};
Object.keys(SORT).forEach(function(k){ SORT[k] = onbekendAchter(SORT[k]); });

function toepassen(){
  var zichtbaar = data.woningen.filter(past).sort(SORT[stand.sort] || SORT.aanbevolen);
  var gegroepeerd = stand.sort === 'aanbevolen';
  var bakken = {nieuw: $('#nieuw .kaarten'), plat: $('#plat .kaarten')};
  $$('.groep').forEach(function(g){ bakken[g.dataset.poort] = $('.kaarten', g); });
  // alle kaarten terug naar #park, dan opnieuw verdelen
  var park = $('#park');
  $$('.woning').forEach(function(k){ park.appendChild(k); });
  var tel = {nieuw:0, plat:0};
  zichtbaar.forEach(function(w){
    var kaartEl = document.getElementById('card-' + w.card_id);
    if(!kaartEl) return;
    var doel = nieuwIds.indexOf(w.id) >= 0 && stand.snel !== 'bewaard' ? 'nieuw' : (gegroepeerd ? w.poort : 'plat');
    tel[doel] = (tel[doel]||0) + 1;
    bakken[doel].appendChild(kaartEl);
    var bw = $('.w-bewaar', kaartEl);
    bw.setAttribute('aria-pressed', opslag.bewaard.indexOf(w.id) >= 0 ? 'true' : 'false');
    var vb = opslag.verborgen.indexOf(w.id) >= 0, vk = $('[data-actie="verberg"]', kaartEl);
    kaartEl.classList.toggle('is-verborgen', vb);
    if(vk){ vk.title = vb ? 'Zet terug' : 'Verberg'; vk.setAttribute('aria-label', (vb ? 'Zet terug: ' : 'Verberg ') + w.titel); }
  });
  // nieuw-sectie: blijft staan met een regel als hij leeg is (zonder filters)
  var nieuw = $('#nieuw');
  var filterActief = actieveFilters() > 0 || stand.snel !== 'alles';
  nieuw.hidden = !tel.nieuw && filterActief;
  $('#nieuw .tel').textContent = tel.nieuw ? String(tel.nieuw) : '';
  $('#nieuw-leeg').hidden = !!tel.nieuw;
  $$('.groep').forEach(function(g){
    var n = tel[g.dataset.poort] || 0;
    g.hidden = !gegroepeerd || !n;
    $('.tel', g).textContent = n + (n === 1 ? ' woning' : ' woningen');
    if(filterActief && n) g.open = true;
  });
  $('#plat').hidden = gegroepeerd || !tel.plat;
  $('#eerder').hidden = !gegroepeerd || stand.snel === 'bewaard' || !$$('.groep').some(function(g){ return !g.hidden; });
  $('#leeg').hidden = zichtbaar.length > 0;
  var geenBewaard = stand.snel === 'bewaard' && !opslag.bewaard.length;
  $('#leeg-kop').textContent = geenBewaard ? 'Nog niets bewaard' : 'Geen woningen met deze filters';
  $('#leeg-tekst').textContent = geenBewaard ? 'Tik op de ster bij een woning om hem hier te bewaren. Bewaren blijft op dit apparaat.'
    : 'Zet een filter uit of wis ze allemaal. Verborgen woningen tellen niet mee.';
  $('#bewaard-balk').hidden = !(stand.snel === 'bewaard' && opslag.bewaard.length);
  $('#bewaard-tekst').textContent = opslag.bewaard.length < 2 ? 'Bewaar nog een woning om te vergelijken.'
    : opslag.bewaard.length + ' bewaard. Zet ze naast elkaar:';
  // tellers
  var totaal = data.woningen.filter(function(w){ return opslag.verborgen.indexOf(w.id) < 0; }).length;
  var tt = $('#top-tel'); tt.hidden = !filterActief; tt.textContent = zichtbaar.length + ' van ' + totaal;
  var n = actieveFilters();
  $$('.filter-teller').forEach(function(t){ t.textContent = n; t.hidden = !n; });
  $$('.chip[data-snel]').forEach(function(c){ c.setAttribute('aria-pressed', c.dataset.snel === stand.snel ? 'true' : 'false'); });
  var snelTel = {alles: totaal, nieuw: nieuwIds.filter(function(id){ return opslag.verborgen.indexOf(id) < 0; }).length,
    bewaard: opslag.bewaard.length};
  ['past','krap','gedaald'].forEach(function(k){
    snelTel[k] = data.woningen.filter(function(w){
      return opslag.verborgen.indexOf(w.id) < 0 && (k==='gedaald' ? w.gedaald : w.poort === k.toUpperCase());
    }).length;
  });
  $$('.chip[data-snel] b').forEach(function(b){ b.textContent = snelTel[b.parentNode.dataset.snel]; });
  var vb = opslag.verborgen.length;
  $('#verborgen-regel').hidden = !vb;
  $('#verborgen-tekst').textContent = vb + (vb === 1 ? ' woning verborgen.' : ' woningen verborgen.');
  $('#toon-verborgen').textContent = stand.toonVerborgen ? 'Verberg ze weer' : 'Toon ze';
  var vg = $$('.vergelijk-knop');
  vg.forEach(function(k){ k.disabled = opslag.bewaard.length < 2; $('.teller', k).textContent = opslag.bewaard.length; });
  $('#sheet-toon').textContent = 'Toon ' + zichtbaar.length + (zichtbaar.length === 1 ? ' woning' : ' woningen');
  opslag.stand = stand; schrijf(opslag);
  if(kaart) tekenPins(zichtbaar);
}

function actieveFilters(){
  var n = 0;
  if(stand.sort !== 'aanbevolen') n++;
  n += stand.poort.length ? 1 : 0; n += stand.stad.length ? 1 : 0;
  if(stand.maxLasten) n++; if(stand.minM2) n++;
  if(stand.toonVerborgen) n++; if(stand.zonderTwijfel) n++;
  return n;
}

function zetFormulier(){
  var f = $('#filterform'); if(!f) return;
  $$('input[name="sort"]', f).forEach(function(i){ i.checked = i.value === stand.sort; });
  $$('input[name="poort"]', f).forEach(function(i){ i.checked = stand.poort.indexOf(i.value) >= 0; });
  $$('input[name="stad"]', f).forEach(function(i){ i.checked = stand.stad.indexOf(i.value) >= 0; });
  $('#f-maxlasten').value = stand.maxLasten; $('#f-minm2').value = stand.minM2;
  $('#f-verborgen').checked = !!stand.toonVerborgen;
  $('#f-twijfel').checked = !!stand.zonderTwijfel;
}
function leesFormulier(){
  var f = $('#filterform');
  stand.sort = ($('input[name="sort"]:checked', f) || {}).value || 'aanbevolen';
  stand.poort = $$('input[name="poort"]:checked', f).map(function(i){ return i.value; });
  stand.stad = $$('input[name="stad"]:checked', f).map(function(i){ return i.value; });
  stand.maxLasten = $('#f-maxlasten').value; stand.minM2 = $('#f-minm2').value;
  stand.toonVerborgen = $('#f-verborgen').checked;
  stand.zonderTwijfel = $('#f-twijfel').checked;
}

function toast(tekst, ongedaan){
  var t = $('#toast');
  $('#toast-tekst').textContent = tekst;
  var k = $('#toast-knop'); k.hidden = !ongedaan; k.onclick = function(){ ongedaan(); t.hidden = true; };
  t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(function(){ t.hidden = true; }, 6000);
}

function koppel(){
  app.addEventListener('click', function(e){
    var el = e.target.closest('button, [data-actie]'); if(!el) return;
    var kaartEl = el.closest('.woning'), id = kaartEl ? kaartEl.dataset.id : null;
    if(el.matches('.chip[data-snel]')){ stand.snel = el.dataset.snel; toepassen(); }
    else if(el.matches('.w-bewaar')){
      var i = opslag.bewaard.indexOf(id);
      if(i >= 0) opslag.bewaard.splice(i, 1); else opslag.bewaard.push(id);
      schrijf(opslag); toepassen();
    }
    else if(el.matches('[data-actie="verberg"]') && opslag.verborgen.indexOf(id) >= 0){
      opslag.verborgen.splice(opslag.verborgen.indexOf(id), 1); schrijf(opslag); toepassen();
      toast('Teruggezet: ' + woningVan(id).titel + '.');
    }
    else if(el.matches('[data-actie="verberg"]')){
      var volgende = kaartEl.nextElementSibling;
      opslag.verborgen.push(id); schrijf(opslag); toepassen();
      if(volgende && volgende.matches('.woning')){ var b = $('.w-bewaar', volgende); if(b) b.focus({preventScroll:true}); }
      toast('Verborgen: ' + woningVan(id).titel + '.', function(){
        opslag.verborgen.splice(opslag.verborgen.indexOf(id), 1); schrijf(opslag); toepassen();
      });
    }
    else if(el.matches('[data-actie="filters"]')){ zetFormulier(); $('#filters').showModal(); }
    else if(el.matches('[data-actie="vergelijk"]')){ vulVergelijk(); $('#vergelijk').showModal(); }
    else if(el.matches('[data-actie="sluit"]')){ el.closest('dialog').close(); }
    else if(el.matches('[data-actie="wis"]')){
      var snel = stand.snel; stand = Object.assign({}, STANDAARD); if(el.closest('#leeg')) snel = 'alles';
      stand.snel = snel; zetFormulier(); toepassen();
    }
    else if(el.matches('[data-view]')){ zetView(el.dataset.view); }
    else if(el.matches('#toon-verborgen')){ stand.toonVerborgen = !stand.toonVerborgen; zetFormulier(); toepassen(); }
    else if(el.matches('[data-naar]')){ naarKaart(el.dataset.naar); }
    else if(el.matches('[data-actie="vergeet"]')){ vergeetApparaat(el); }
    else if(el.matches('[data-actie="budget"]')){ e.preventDefault(); var b = $('#budget'); b.open = true;
      b.scrollIntoView({block:'center'}); $('summary', b).focus({preventScroll:true}); }
  });
  var f = $('#filterform');
  if(f){
    f.addEventListener('change', function(){ leesFormulier(); toepassen(); });
    f.addEventListener('input', function(){ leesFormulier(); toepassen(); });
    f.addEventListener('submit', function(e){ e.preventDefault(); $('#filters').close(); });
  }
  $$('dialog.sheet').forEach(function(d){
    d.addEventListener('click', function(e){ if(e.target === d) d.close(); });
  });
}

/* "Onthoud op dit apparaat": het slotscherm zet window.fundaApparaat; hier tonen en vergeten. */
function apparaat(){
  var blok = $('#apparaat'), a = window.fundaApparaat;
  if(blok) blok.hidden = !(a && a.onthouden);
}
function vergeetApparaat(knop){
  var a = window.fundaApparaat; if(!a || !a.vergeet) return;
  knop.disabled = true;
  Promise.resolve(a.vergeet()).then(function(){
    apparaat(); toast('Dit apparaat is vergeten. Volgende keer vraagt het rapport weer om je wachtwoord.');
  }, function(){
    knop.disabled = false; toast('Vergeten lukte niet. Wis de websitegegevens van dit rapport in je browser.');
  });
}

function zetView(v){
  app.dataset.view = v;
  $$('[data-view]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'); });
  if(v === 'kaart'){ startKaart(); setTimeout(function(){ if(kaart) kaart.invalidateSize(); }, 50); }
  window.scrollTo(0, 0);
}

function naarKaart(cardId){
  if(window.matchMedia('(max-width:63.99rem)').matches) zetView('lijst');
  var el = document.getElementById('card-' + cardId); if(!el) return;
  var groep = el.closest('details.groep'); if(groep) groep.open = true;
  var meer = $('.w-meer', el); if(meer) meer.open = true;
  el.scrollIntoView({block:'start'});
  el.classList.add('is-uitgelicht'); setTimeout(function(){ el.classList.remove('is-uitgelicht'); }, 1800);
}

/* Vergelijken. Zonder scenario's geen rij Financiering; per woning zonder: het poortwoord. */
function vergelijkHtml(ws){
  var sc = ws.some(function(w){ return w.scenario_tekst; });
  var rijen = [
    ['Status', function(w){ return esc(w.status_kort); }],
    sc && ['Financiering', function(w){ return esc(w.scenario_tekst ? finTekst(w.scenario_tekst) : String(w.status_kort||'').split(' · ')[0]); }],
    ['Woonlasten', function(w){ return w.netto==null ? 'onbekend' : eur(w.netto) + ' netto per maand'; }, 'netto', -1],
    ['Vraagprijs', function(w){ return w.prijs ? eur(w.prijs) : 'op aanvraag'; }, 'prijs', -1],
    ['Score', function(w){ return w.score_tekst; }, 'score', 1],
    ['Oppervlak', function(w){ return w.m2 + ' m²'; }, 'm2', 1],
    ['Fiets naar werk', function(w){ return w.reis_min==null ? 'onbekend' : '≈ ' + w.reis_min + ' min'; }, 'reis_min', -1],
    ['Sterkste plus', function(w){ return esc(w.top_plus || 'geen'); }],
    ['Sterkste let op', function(w){ return esc(w.top_let_op || 'geen'); }],
    ['Buurt', function(w){ return esc(w.buurt); }]
  ].filter(Boolean);
  var h = '<thead><tr><th scope="col"><span class="vh">Kenmerk</span></th>' +
    ws.map(function(w){ return '<th scope="col">' + esc(w.titel) + '</th>'; }).join('') + '</tr></thead><tbody>';
  rijen.forEach(function(r){
    var beste = null;
    if(r[2]){
      var vals = ws.map(function(w){ return w[r[2]]; }).filter(function(v){ return v != null; });
      if(vals.length > 1) beste = r[3] > 0 ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
    }
    h += '<tr><th scope="row">' + r[0] + '</th>' + ws.map(function(w){
      var b = beste != null && w[r[2]] === beste;
      return '<td' + (b ? ' class="beste"' : '') + '>' + r[1](w) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody>';
}

function vulVergelijk(){ $('#vergelijk-tabel').innerHTML = vergelijkHtml(opslag.bewaard.map(woningVan).filter(Boolean)); }

/* Kaart: Leaflet, pins naar poort, nieuw als ring. Lazy: pas bij openen (mobiel). */
function startKaart(){
  if(kaart) return;
  var doos = $('#kaart'); if(!doos) return;
  if(!window.L){
    $('#kaart-melding').hidden = false;
    var pogingen = 0, t = setInterval(function(){
      if(window.L){ clearInterval(t); $('#kaart-melding').hidden = true; startKaart(); }
      else if(++pogingen > 40){ clearInterval(t); $('#kaart-melding').textContent = 'De kaart kon niet laden. Zonder netwerk werkt alleen de lijst.'; }
    }, 150);
    return;
  }
  kaart = L.map(doos, {zoomControl:true, attributionControl:true, tap:false});
  kaart.zoomControl.setPosition('topright');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(kaart);
  kaart._pins = L.layerGroup().addTo(kaart);
  tekenPins(data.woningen.filter(past), true);
}
function tekenPins(ws, passen){
  if(!kaart) return;
  kaart._pins.clearLayers();
  var punten = [];
  ws.forEach(function(w){
    if(w.lat == null) return;
    var nieuw = nieuwIds.indexOf(w.id) >= 0;
    // Raakvlak om een pil van 32 px; het icoon draagt de poort ook zonder kleur
    var icon = L.divIcon({className:'pin-raak', iconSize:[64,44], iconAnchor:[32,22],
      html:'<span class="pin p-' + POORT_CLS[w.poort] + (nieuw ? ' is-nieuw' : '') + '"><svg class="ic" aria-hidden="true" focusable="false">' +
        '<use href="#i-' + POORT_IC[w.poort] + '"/></svg>' + esc(w.score_tekst) + '</span>'});
    // Beste woning bovenop: poort, dan score
    var m = L.marker([w.lat, w.lon], {icon:icon, title:w.titel + ', ' + w.status_kort + (nieuw ? ', nieuw' : ''), keyboard:true,
      zIndexOffset:(3 - POORT_RANG[w.poort]) * 1000 + Math.round((w.score || 0) * 10)});
    m.bindPopup('<div class="pop"><h3>' + esc(w.titel) + '</h3><p>' + esc(w.status_kort) +
      (w.scenario_tekst ? '<br>Financiering: ' + esc(finTekst(w.scenario_tekst)) : '') + '</p><p>' + esc(w.buurt) +
      (w.reis_tekst ? ' · ' + esc(w.reis_tekst) : '') + '</p><button type="button" class="knop knop-sec" data-naar="' + w.card_id +
      '">Toon in lijst</button></div>', {autoPanPaddingTopLeft:[16,64], autoPanPaddingBottomRight:[16,16]});
    m.addTo(kaart._pins); punten.push([w.lat, w.lon]);
  });
  if(passen !== false && punten.length) kaart.fitBounds(punten, {padding:[40,40], maxZoom:12});
  if(!kaart._popupKlik){
    kaart._popupKlik = true;
    kaart.on('popupopen', function(e){
      var b = e.popup.getElement().querySelector('[data-naar]');
      if(b) b.addEventListener('click', function(){ naarKaart(b.dataset.naar); kaart.closePopup(); });
    });
  }
}

<script>
(function(){
  var WEB_PUSH_PUBLIC_KEY = "BFRCyOQV_djJ9b69r16m8gnwYLeozbNGQ_zZFi0BU6ENkhO41ZFFfE5MzVyl-hHvgsfnlWlnnvwh-daGeR2Zx-o";
  function pushStatus(msg, isError){
    var el = document.getElementById('push-status');
    if(!el) return;
    el.textContent = msg || '';
    el.classList.toggle('is-fout', !!isError);
  }
  function verbergAlsIngesteld(){
    var blok = document.getElementById('meldingen');
    if(!blok || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
    navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); })
      .then(function(sub){ if(sub && blok.dataset.net !== '1') blok.hidden = true; })
      .catch(function(){});
  }
  function b64ToUint8Array(base64){
    var padding = '='.repeat((4 - base64.length % 4) % 4);
    var b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
    var raw = atob(b64);
    var out = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  async function ensurePushSubscription(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
      throw new Error('Web Push wordt niet ondersteund in deze browser.');
    }
    var permission = await Notification.requestPermission();
    if(permission !== 'granted') throw new Error('Notificaties zijn niet toegestaan.');
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64ToUint8Array(WEB_PUSH_PUBLIC_KEY)
      });
    }
    return sub;
  }
  function wirePushSetup(){
    var btn = document.getElementById('push-subscribe-btn');
    var copy = document.getElementById('push-copy-btn');
    var output = document.getElementById('push-subscription-output');
    if(!btn || !output || btn.dataset.bound === '1') return;
    btn.dataset.bound = '1';
    verbergAlsIngesteld();
    btn.addEventListener('click', async function(){
      btn.disabled = true;
      var blok = document.getElementById('meldingen');
      if(blok) blok.dataset.net = '1';
      pushStatus('Abonnement maken...');
      try {
        var sub = await ensurePushSubscription();
        output.value = JSON.stringify(sub.toJSON(), null, 2);
        output.hidden = false;
        if(copy) copy.hidden = false;
        pushStatus('Kopieer dit abonnement naar de GitHub-secret WEB_PUSH_SUBSCRIPTION.');
      } catch(err) {
        pushStatus(err && err.message ? err.message : String(err), true);
      } finally {
        btn.disabled = false;
      }
    });
    if(copy){
      copy.addEventListener('click', async function(){
        try {
          await navigator.clipboard.writeText(output.value || '');
          pushStatus('Abonnement gekopieerd.');
        } catch(err) {
          output.focus();
          output.select();
          pushStatus('Kopieer de geselecteerde tekst zelf.', true);
        }
      });
    }
  }
  var previous = window.fundaAfterReportLoad;
  window.fundaAfterReportLoad = function(){
    if(previous) previous();
    wirePushSetup();
  };
  document.addEventListener('DOMContentLoaded', wirePushSetup);
})();
</script>

const ITERS = 100000;
const GZ = 1;   // 1 = body is vóór het versleutelen met gzip ingepakt
/* Onthoud op dit apparaat: de PBKDF2-basissleutel als niet-exporteerbare CryptoKey in IndexedDB, nooit
   het wachtwoord. Die sleutel hangt niet af van het zout, dus hij werkt ook na een run met een nieuw zout. */
const DB = "funda_rapport_slot", BAK = "sleutels", ID = "basis", DAGEN = 30;
const OUD_PW = "funda_pw_persist_v1";   // vroeger: het wachtwoord leesbaar in localStorage
const TE_OUD = "Deze browser kan het rapport niet openen. Werk je iPhone bij naar iOS 16.4 of nieuwer.";
const $ = (id) => document.getElementById(id);
function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
class TeOud extends Error {}
function basisSleutel(pw){ return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]); }
async function decrypt(basis){
  if(GZ && typeof DecompressionStream === "undefined") throw new TeOud();
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITERS, hash:"SHA-256"}, basis, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT));  // fout wachtwoord = fout hier
  if(!GZ) return new TextDecoder().decode(pt);
  return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
function db(modus, werk){
  return new Promise((ok, nee) => {
    if(!window.indexedDB) return nee(new Error("geen IndexedDB"));
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(BAK);
    r.onerror = () => nee(r.error); r.onblocked = () => nee(new Error("geblokkeerd"));
    r.onsuccess = () => {
      const d = r.result; let uit;
      try {
        const tx = d.transaction(BAK, modus), q = werk(tx.objectStore(BAK));
        q.onsuccess = () => { uit = q.result; };
        tx.oncomplete = () => { d.close(); ok(uit); };
        tx.onerror = tx.onabort = () => { d.close(); nee(tx.error || new Error("afgebroken")); };
      } catch(e){ d.close(); nee(e); }   // bijv. DataCloneError: deze browser bewaart geen CryptoKey
    };
  });
}
const bewaar = (sleutel) => db("readwrite", (s) => s.put({sleutel, tot: Date.now() + DAGEN * 864e5}, ID));
const haal = () => db("readonly", (s) => s.get(ID));
const wis = () => db("readwrite", (s) => s.delete(ID));
function onthouden(ja){ window.fundaApparaat.onthouden = ja; $("vergeet").hidden = !ja; }
window.fundaApparaat = {onthouden: false, vergeet: async () => { await wis(); onthouden(false); }};
function melding(tekst){
  const m = $("slot-melding"); m.textContent = tekst; m.hidden = false;
  clearTimeout(melding.t); melding.t = setTimeout(() => { m.hidden = true; }, 8000);
}
function toon(html){
  const c = $("content"); c.hidden = false; c.innerHTML = html;
  $("slot").hidden = true;
  if(window.fundaAfterReportLoad) window.fundaAfterReportLoad();
}
$("pw-toon").addEventListener("click", function(){
  const pw = $("pw"), zicht = pw.type === "password";
  pw.type = zicht ? "text" : "password";
  this.setAttribute("aria-pressed", String(zicht)); this.setAttribute("aria-label", zicht ? "Verberg wachtwoord" : "Toon wachtwoord");
});
$("vergeet").addEventListener("click", async () => {
  try { await window.fundaApparaat.vergeet(); melding("Dit apparaat is vergeten."); } catch(_){ melding("Vergeten lukte niet."); }
});
$("slot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("pw"), btn = $("btn"), err = $("err");
  err.textContent = ""; pw.removeAttribute("aria-invalid");
  btn.disabled = true; btn.innerHTML = '<span class="draai" aria-hidden="true"></span> Ontgrendelen';
  try {
    await new Promise(r => setTimeout(r, 50));
    const basis = await basisSleutel(pw.value);
    const html = await decrypt(basis);
    pw.value = "";
    if($("remember").checked){
      try { await bewaar(basis); onthouden(true); }
      catch(_){ melding("Onthouden lukt niet in deze browser. Vul je wachtwoord de volgende keer opnieuw in."); }
    }
    toon(html);
  } catch(ex){
    if(ex instanceof TeOud){ err.textContent = TE_OUD; }
    else { pw.setAttribute("aria-invalid", "true"); err.textContent = "Dit wachtwoord klopt niet. Probeer het opnieuw."; }
    btn.disabled = false; btn.textContent = "Ontgrendelen"; pw.focus();
  }
});
(async () => {
  // Migratie: een oud, leesbaar bewaard wachtwoord wordt een sleutel en verdwijnt uit de opslag.
  let oud = "", bewaard = null, basis = null;
  try { const d = JSON.parse(localStorage.getItem(OUD_PW) || "null"); if(d && d.pw && Date.now() <= d.expires) oud = d.pw; } catch(_){}
  try { localStorage.removeItem(OUD_PW); } catch(_){}
  try { sessionStorage.removeItem("funda_pw"); } catch(_){}
  try { bewaard = await haal(); } catch(_){}
  if(bewaard && bewaard.sleutel && Date.now() <= bewaard.tot) basis = bewaard.sleutel;
  else if(bewaard){ try { await wis(); } catch(_){} bewaard = null; }
  if(!basis && oud){ try { basis = await basisSleutel(oud); } catch(_){} }
  if(!basis) return;
  onthouden(!!bewaard);
  try {
    const html = await decrypt(basis);
    if(!bewaard){ try { await bewaar(basis); onthouden(true); } catch(_){} }
    toon(html);
  } catch(ex){
    if(ex instanceof TeOud){ $("err").textContent = TE_OUD; return; }
    if(bewaard){ try { await wis(); } catch(_){} }   // nieuw wachtwoord: de oude sleutel past niet meer
    onthouden(false);
    $("err").textContent = "De onthouden sleutel werkt niet meer. Vul je wachtwoord opnieuw in.";
  }
})();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js', {scope:'./'}).catch(()=>{}));
}

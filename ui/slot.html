<body>
<main id="slot" class="slot">
  <div class="slot-tegel">
    <div class="slot-merk" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
    <div>
      <h1>Woningrapport</h1>
      <p class="slot-intro">Vul je wachtwoord in. Het rapport wordt op dit apparaat ontsleuteld; je wachtwoord gaat nergens heen.</p>
    </div>
    <form id="slot-form" class="slot-form" novalidate>
      <div class="veld">
        <label for="pw">Wachtwoord</label>
        <div class="pw-rij">
          <input id="pw" type="password" autocomplete="current-password" aria-describedby="err" required>
          <button type="button" class="icoonknop" id="pw-toon" aria-controls="pw" aria-pressed="false" aria-label="Toon wachtwoord">
            <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="streep" d="M4 4l16 16"/></svg>
          </button>
        </div>
        <p id="err" class="slot-fout" role="alert" aria-live="assertive"></p>
      </div>
      <label class="keuze" for="remember"><input id="remember" type="checkbox" aria-describedby="remember-uitleg"> Onthoud op dit apparaat</label>
      <p id="remember-uitleg" class="slot-hint">Bewaart een sleutel op dit apparaat, nooit je wachtwoord. 30 dagen geldig.</p>
      <button id="btn" type="submit" class="knop knop-sec">Ontgrendelen</button>
      <button id="vergeet" type="button" class="linkknop" hidden>Vergeet dit apparaat</button>
    </form>
  </div>
</main>
<div id="content" hidden></div>
<p id="slot-melding" class="slot-melding context-strong" role="status" hidden></p>
<script type="application/json" id="slot-data">__PAKKET__</script>
</body>
</html>
